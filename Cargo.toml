[package]
name = "dedup"
version = "0.1.0"
edition = "2021"
description = "Cross-platform file indexing and deduplication tool"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Hashing
blake3 = "1"
md5 = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Async & Parallelism
rayon = "1"

# File system
walkdir = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Progress bar
indicatif = "0.17"

# Byte size formatting
bytesize = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
